<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <!-- url_for vincula a pasta static automaticamente -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<main class="cards">
    <h1>{{ titulo }}</h1>
    <p><strong>Aluno: </strong> {{ usuario.nome }}</p>
    <p><strong>Curso: </strong> {{ usuario.curso }}</p>
    <p><strong>Nota final: </strong> {{ usuario.nota }}</p>

    <div class="tag {{ 'Aprovado' if resultado == 'Aprovado' else 'Reprovado' }}">
        Status: {{ resultado }}
    </div>

</main>
    
<body>
</body>

</html>
